<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#444;stroke-width:1.2}
      .lvl{fill:#f3f6fa;stroke:#2b5d8a;stroke-width:1.4}
      .ext{fill:#f6f6f6;stroke:#888;stroke-width:1.2}
      .act{fill:#fdf0ec;stroke:#b5482d;stroke-width:1.4}
      .t{font-weight:bold}
      .s{font-size:10.5px;fill:#333}
      .ln{stroke:#444;stroke-width:1.2;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <!-- Entrées -->
  <rect class="box" x="10" y="150" width="130" height="60" rx="6"/>
  <text x="75" y="175" text-anchor="middle" class="t">Interface</text>
  <text x="75" y="192" text-anchor="middle" class="s">Streamlit, choix 0 à 3</text>
  <rect class="box" x="10" y="240" width="130" height="60" rx="6"/>
  <text x="75" y="265" text-anchor="middle" class="t">eval.py</text>
  <text x="75" y="282" text-anchor="middle" class="s">80 cas, même protocole</text>

  <!-- Niveaux -->
  <rect class="lvl" x="190" y="20" width="250" height="60" rx="6"/>
  <text x="315" y="44" text-anchor="middle" class="t">Niveau 0 : LLM seul</text>
  <text x="315" y="62" text-anchor="middle" class="s">prompt et marqueurs, sans documents</text>

  <rect class="lvl" x="190" y="100" width="250" height="90" rx="6"/>
  <text x="315" y="122" text-anchor="middle" class="t">Niveau 1 : RAG</text>
  <text x="315" y="140" text-anchor="middle" class="s">recherche dense e5-small (5 extraits)</text>
  <text x="315" y="156" text-anchor="middle" class="s">réponse qui cite ses sources [id]</text>
  <text x="315" y="172" text-anchor="middle" class="s">abstention [ABSTENTION]</text>

  <rect class="lvl" x="190" y="210" width="250" height="110" rx="6"/>
  <text x="315" y="232" text-anchor="middle" class="t">Niveau 2 : agent</text>
  <text x="315" y="250" text-anchor="middle" class="s">boucle écrite à la main, sans framework</text>
  <text x="315" y="266" text-anchor="middle" class="s">bornée : 8 étapes, 20 000 tokens</text>
  <text x="315" y="282" text-anchor="middle" class="s">erreurs d'outils renvoyées au modèle</text>
  <text x="315" y="298" text-anchor="middle" class="s">schémas JSON validés par jsonschema</text>

  <rect class="ext" x="190" y="340" width="250" height="60" rx="6"/>
  <text x="315" y="364" text-anchor="middle" class="t">Niveau 3 : agent avec plan</text>
  <text x="315" y="382" text-anchor="middle" class="s">plan sans outils, puis boucle du niveau 2</text>

  <path class="ln" d="M140,180 C165,180 165,50 188,50"/>
  <path class="ln" d="M140,180 L188,145"/>
  <path class="ln" d="M140,180 C165,190 165,265 188,265"/>
  <path class="ln" d="M140,270 C165,270 165,370 188,370"/>

  <!-- Outils de l'agent -->
  <rect class="box" x="490" y="200" width="200" height="135" rx="6"/>
  <text x="590" y="222" text-anchor="middle" class="t">Outils, classés par effet</text>
  <text x="502" y="244" class="s">read : search_rules, list_matches,</text>
  <text x="502" y="259" class="s">        match_events</text>
  <text x="502" y="279" class="s">compute : team_stats, team_form, simulate_match</text>
  <rect class="act" x="500" y="292" width="180" height="34" rx="4"/>
  <text x="590" y="313" text-anchor="middle" class="s">irreversible : publish_report</text>
  <path class="ln" d="M440,265 L488,265"/>

  <!-- Contrôle de l'action -->
  <rect class="act" x="730" y="270" width="215" height="80" rx="6"/>
  <text x="837" y="292" text-anchor="middle" class="t">Contrôle de l'action</text>
  <text x="837" y="310" text-anchor="middle" class="s">1. règles métier vérifiées par code</text>
  <text x="837" y="326" text-anchor="middle" class="s">2. confirmation de l'utilisateur</text>
  <text x="837" y="342" text-anchor="middle" class="s">3. reports/&lt;affiche&gt;.json, puis PDF</text>
  <path class="ln" d="M680,309 L728,309"/>

  <!-- Données -->
  <rect class="box" x="490" y="100" width="200" height="70" rx="6"/>
  <text x="590" y="122" text-anchor="middle" class="t">Corpus RAG</text>
  <text x="590" y="140" text-anchor="middle" class="s">lois du jeu IFAB 2026/27, VAR</text>
  <text x="590" y="156" text-anchor="middle" class="s">Wikipédia FR : 43 docs, 793 extraits</text>
  <path class="ln" d="M488,140 L442,140"/>
  <path class="ln" d="M560,198 L560,172"/>

  <rect class="box" x="730" y="150" width="215" height="70" rx="6"/>
  <text x="837" y="172" text-anchor="middle" class="t">StatsBomb open data</text>
  <text x="837" y="190" text-anchor="middle" class="s">Euro 2024, Copa América 2024,</text>
  <text x="837" y="206" text-anchor="middle" class="s">CdM 2018 et 2022, Euro 2020 : 262 matchs</text>
  <path class="ln" d="M728,215 L692,235"/>

  <!-- LLM et mesure -->
  <rect class="box" x="490" y="20" width="200" height="60" rx="6"/>
  <text x="590" y="44" text-anchor="middle" class="t">LLM : gpt-6-luna</text>
  <text x="590" y="62" text-anchor="middle" class="s">OpenAI ; référence ouverte : gpt-oss-120b</text>
  <path class="ln" d="M442,50 L488,50"/>

  <rect class="box" x="730" y="20" width="215" height="110" rx="6"/>
  <text x="837" y="42" text-anchor="middle" class="t">Mesure</text>
  <text x="837" y="60" text-anchor="middle" class="s">Recall@5, MRR, exactitude, citation</text>
  <text x="837" y="76" text-anchor="middle" class="s">fidélité (juge Qwen, kappa 1,00)</text>
  <text x="837" y="92" text-anchor="middle" class="s">pass^3, coût, latence, IC à 95 %</text>
  <text x="837" y="108" text-anchor="middle" class="s">traces JSONL de chaque exécution</text>

  <text x="10" y="425" class="s">Flèches : appels. En rouge : la seule action irréversible et son contrôle.</text>
</svg>
